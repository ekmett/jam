name: Managed runtimes

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAM_JOBS: '3'

defaults:
  run:
    working-directory: vm

jobs:
  native_windows:
    name: Native and guest bridge (windows)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: vm
    steps:
      - &windows_checkout
        name: Prepare Windows checkout
        working-directory: .
        run: |
          Set-ItemProperty 'HKLM:/SYSTEM/CurrentControlSet/Control/FileSystem' -Name LongPathsEnabled -Type DWord -Value 1
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select dependency directory
        run: '"JAM_CI_TOOLS=$env:RUNNER_TEMP/jam-vm-toolchain" >> $env:GITHUB_ENV'
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: windows-2022-x86_64-native-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
      - name: Install pinned build dependencies
        timeout-minutes: 10
        run: ./tools/ci/setup_windows.ps1 native
      - name: Managed runtimes native collector
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          $env:JAM_BOOT_JDK = $null
          ./tools/build_native.ps1
          ./build-jam/jam-vm-test.exe --require-simd
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-jam/jam-generational-test.exe --require-simd
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Managed runtimes guest bridge on stock Java
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/build_bridge.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:JAM_BOOT_JDK/bin/javac.exe" -cp build/bridge/jam-vm.jar -d build-bridge-test tests/bridge/WeakBridgeSmoke.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:JAM_BOOT_JDK/bin/java.exe" -Xshare:off --enable-native-access=ALL-UNNAMED `
            "-Djava.library.path=$PWD/build/bridge/lib" `
            -cp 'build-bridge-test;build/bridge/jam-vm.jar' WeakBridgeSmoke unavailable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  native:
    name: Native and guest bridge (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            cache: macos-26-arm64-xcode26.6
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
          - platform: linux
            runner: ubuntu-24.04
            cache: ubuntu-24.04-x86_64
            developer_dir: ''
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select dependency directory
        run: echo "JAM_CI_TOOLS=$RUNNER_TEMP/jam-vm-toolchain" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: ${{ matrix.cache }}-native-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
      - name: Install pinned build dependencies
        run: bash tools/ci/setup_${{ matrix.platform }}.sh native
      - name: Managed runtimes native collector
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          env -u JAM_BOOT_JDK bash tools/build_native.sh
          build-jam/jam-vm-test --require-simd
          build-jam/jam-generational-test --require-simd
      - name: Managed runtimes guest bridge on stock Java
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          python3 tools/build_bridge.py
          "$JAM_BOOT_JDK/bin/javac" -cp build/bridge/jam-vm.jar -d build-bridge-test tests/bridge/WeakBridgeSmoke.java
          "$JAM_BOOT_JDK/bin/java" -Xshare:off --enable-native-access=ALL-UNNAMED \
            "-Djava.library.path=$PWD/build/bridge/lib" \
            -cp build-bridge-test:build/bridge/jam-vm.jar WeakBridgeSmoke unavailable

  hotspot:
    name: HotSpot integration (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            cache: macos-26-arm64-xcode26.6
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
          - platform: linux
            runner: ubuntu-24.04
            cache: ubuntu-24.04-x86_64
            developer_dir: ''
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select dependency directory
        run: echo "JAM_CI_TOOLS=$RUNNER_TEMP/jam-vm-toolchain" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: ${{ matrix.cache }}-hotspot-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
          restore-keys: ${{ matrix.cache }}-native-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
      - name: Install pinned build dependencies
        run: bash tools/ci/setup_${{ matrix.platform }}.sh hotspot
      - name: Prepare pinned JDK sources
        run: |
          python3 tools/fetch_sources.py --full
          python3 tools/prepare_jdk.py
      - name: Build native collector and test JNI bridge
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          bash tools/build_native.sh
      - name: Build Jam JDK
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          if [[ $RUNNER_OS == Linux ]]; then
            bash tools/build_hotspot.sh --with-native-debug-symbols=none
          else
            bash tools/build_hotspot.sh
          fi
      - name: Run VM, collector identity and guest regressions
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          export JAM_JAVA="$(python3 tools/platform_paths.py)/bin/java"
          export JAM_JAVAC="$(dirname "$JAM_JAVA")/javac"
          export JAM_STOCK_JAVA="$JAM_BOOT_JDK/bin/java"
          bash tools/check_vm.sh
          python3 tools/check_gc_registration.py
          python3 tools/check_bridge.py
      - name: Package and relocate the JDK
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          python3 tools/package_jdk.py \
            --java-home "$(python3 tools/platform_paths.py)" \
            --output build/jam-jdk
          mv build/jam-jdk "$RUNNER_TEMP/jam-jdk"
          python3 tools/check_package.py --java-home "$RUNNER_TEMP/jam-jdk"

  graal_macos:
    name: Build GraalVM (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            cache: macos-26-arm64-xcode26.6
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    timeout-minutes: 180
    steps: &graal_build_steps
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select dependency directory
        run: echo "JAM_CI_TOOLS=$RUNNER_TEMP/jam-vm-toolchain" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: ${{ matrix.cache }}-graal-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
          restore-keys: |
            ${{ matrix.cache }}-hotspot-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
            ${{ matrix.cache }}-native-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
      - name: Install pinned build dependencies
        run: bash tools/ci/setup_${{ matrix.platform }}.sh graal
      - name: Prepare pinned LabsJDK and Graal sources
        run: |
          python3 tools/fetch_sources.py --graal
          python3 tools/prepare_jdk.py --graal
          python3 tools/prepare_graal.py
          python3 tools/check_patches.py --graal
      - name: Build native collector and LabsJDK
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          export JAM_HOTSPOT_SOURCE="$PWD/upstream/labsjdk25"
          bash tools/build_native.sh
          if [[ $RUNNER_OS == Linux ]]; then
            bash tools/build_hotspot.sh --graal --with-native-debug-symbols=none
          else
            bash tools/build_hotspot.sh --graal
          fi
      - name: Build and package GraalVM
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          df -h . "$RUNNER_TEMP"
          bash tools/build_graal.sh
      - name: Check compiler barriers and derived pointers
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          bash tools/check_graal_compiler.sh
      - name: Archive runtime and consumer dependencies
        run: python3 tools/ci/archive_graal.py --output "$RUNNER_TEMP/jam-graal-ci.tar.gz"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jam-graal-${{ matrix.platform }}
          path: ${{ runner.temp }}/jam-graal-ci.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  graal_linux:
    name: Build GraalVM (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            cache: ubuntu-24.04-x86_64
            developer_dir: ''
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    timeout-minutes: 180
    steps: *graal_build_steps

  consumers_macos:
    name: ${{ matrix.suite }} (${{ matrix.platform }})
    needs: graal_macos
    strategy:
      fail-fast: false
      matrix:
        suite: [GraalVM runtime, SubstrateVM]
        include:
          - platform: macos
            runner: macos-26
            cache: macos-26-arm64-xcode26.6
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            image_heap: 6g
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      JAM_NATIVE_IMAGE_HEAP: ${{ matrix.image_heap }}
    timeout-minutes: 75
    steps: &graal_consumer_steps
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: jam-graal-${{ matrix.platform }}
          path: ${{ runner.temp }}/jam-graal-download
      - name: Restore runtime and consumer dependencies
        run: |
          mkdir "$RUNNER_TEMP/jam-graal-ci"
          tar -xzf "$RUNNER_TEMP/jam-graal-download/jam-graal-ci.tar.gz" -C "$RUNNER_TEMP/jam-graal-ci"
          cp -R "$RUNNER_TEMP/jam-graal-ci/build-jam" .
          cp -R "$RUNNER_TEMP/jam-graal-ci/upstream" .
          echo "JAM_CI_JAVA_HOME=$RUNNER_TEMP/jam-graal-ci/graalvm" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/jam-graal-download/jam-graal-ci.tar.gz"
      - name: Select dependency directory
        if: matrix.suite == 'GraalVM runtime'
        run: echo "JAM_CI_TOOLS=$RUNNER_TEMP/jam-vm-toolchain" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        if: matrix.suite == 'GraalVM runtime'
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: ${{ matrix.cache }}-graal-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
          restore-keys: |
            ${{ matrix.cache }}-hotspot-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
            ${{ matrix.cache }}-native-${{ hashFiles(format('vm/tools/ci/setup_{0}.sh', matrix.platform)) }}
      - name: Install matching stock compiler
        if: matrix.suite == 'GraalVM runtime'
        run: bash tools/ci/setup_${{ matrix.platform }}.sh graal
      - name: Run compiled heap and weak-pointer regressions
        if: matrix.suite == 'GraalVM runtime'
        run: |
          source "$JAM_CI_TOOLS/env.sh"
          python3 tools/check_graal.py --java-home "$JAM_CI_JAVA_HOME" \
            --unsupported-libgraal "$JAM_STOCK_GRAAL_HOME/lib"
          python3 tools/check_package.py --java-home "$JAM_CI_JAVA_HOME"
      - name: Install Native Image build dependencies
        if: matrix.suite == 'SubstrateVM' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential zlib1g-dev binutils
      - name: Build and run Jam native executables
        if: matrix.suite == 'SubstrateVM'
        run: python3 tools/check_substrate.py --java-home "$JAM_CI_JAVA_HOME"

  consumers_linux:
    name: ${{ matrix.suite }} (${{ matrix.platform }})
    needs: graal_linux
    strategy:
      fail-fast: false
      matrix:
        suite: [GraalVM runtime, SubstrateVM]
        include:
          - platform: linux
            runner: ubuntu-24.04
            cache: ubuntu-24.04-x86_64
            developer_dir: ''
            image_heap: 4g
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      JAM_NATIVE_IMAGE_HEAP: ${{ matrix.image_heap }}
    timeout-minutes: 75
    steps: *graal_consumer_steps

  hotspot_windows:
    name: HotSpot integration (windows)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: vm
    steps:
      - *windows_checkout
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select dependency directory
        run: '"JAM_CI_TOOLS=$env:RUNNER_TEMP/jam-vm-toolchain" >> $env:GITHUB_ENV'
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: windows-2022-x86_64-hotspot-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
          restore-keys: windows-2022-x86_64-native-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
      - name: Install pinned build dependencies
        timeout-minutes: 10
        run: ./tools/ci/setup_windows.ps1 hotspot
      - name: Prepare pinned JDK sources
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/fetch_sources.py --full
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/prepare_jdk.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native collector and Jam JDK
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          ./tools/build_native.ps1
          ./tools/build_hotspot.ps1
      - name: Run VM, collector identity and guest regressions
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          $env:Path = "$PWD/build-jam;$env:Path"
          $jdk = python tools/platform_paths.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:JAM_JAVA = "$jdk/bin/java.exe"
          $env:JAM_JAVAC = "$jdk/bin/javac.exe"
          $env:JAM_STOCK_JAVA = "$env:JAM_BOOT_JDK/bin/java.exe"
          python tools/check_vm.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_gc_registration.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_bridge.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and relocate the JDK
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          $jdk = python tools/platform_paths.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package_jdk.py --java-home $jdk --output build/jam-jdk `
            --runtime-license "$env:JAM_CI_TOOLS/Microsoft-Build-Tools-License.docx" `
            --runtime-license "$env:JAM_CI_TOOLS/Microsoft-Redistribution.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item build/jam-jdk "$env:RUNNER_TEMP/jam-jdk"
          python tools/check_package.py --java-home "$env:RUNNER_TEMP/jam-jdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  graal_windows:
    name: Build GraalVM (windows)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: vm
    steps:
      - *windows_checkout
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select dependency directory
        run: '"JAM_CI_TOOLS=$env:RUNNER_TEMP/jam-vm-toolchain" >> $env:GITHUB_ENV'
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: windows-2022-x86_64-graal-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
          restore-keys: |
            windows-2022-x86_64-hotspot-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
            windows-2022-x86_64-native-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
      - name: Install pinned build dependencies
        timeout-minutes: 10
        run: ./tools/ci/setup_windows.ps1 graal
      - name: Prepare pinned LabsJDK and Graal sources
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/fetch_sources.py --graal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/prepare_jdk.py --graal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/prepare_graal.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_patches.py --graal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native collector and LabsJDK
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          $env:JAM_HOTSPOT_SOURCE = "$PWD/upstream/labsjdk25"
          ./tools/build_native.ps1
          ./tools/build_hotspot.ps1 -Graal
      - name: Build and package GraalVM
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/build_graal.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check compiler barriers and derived pointers
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/check_graal_compiler.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Archive runtime and consumer dependencies
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/ci/archive_graal.py --output "$env:RUNNER_TEMP/jam-graal-ci.tar.gz"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jam-graal-windows
          path: ${{ runner.temp }}/jam-graal-ci.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  consumers_windows:
    name: ${{ matrix.suite }} (windows)
    needs: graal_windows
    strategy:
      fail-fast: false
      matrix:
        suite: [GraalVM runtime, SubstrateVM]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      JAM_NATIVE_IMAGE_HEAP: 4g
    defaults:
      run:
        shell: pwsh
        working-directory: vm
    steps:
      - *windows_checkout
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: jam-graal-windows
          path: ${{ runner.temp }}/jam-graal-download
      - name: Restore runtime and consumer dependencies
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/jam-graal-ci" | Out-Null
          & "$env:SystemRoot/System32/tar.exe" -xzf "$env:RUNNER_TEMP/jam-graal-download/jam-graal-ci.tar.gz" -C "$env:RUNNER_TEMP/jam-graal-ci"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -Recurse "$env:RUNNER_TEMP/jam-graal-ci/build-jam" .
          Copy-Item -Recurse "$env:RUNNER_TEMP/jam-graal-ci/upstream" .
          "JAM_CI_JAVA_HOME=$env:RUNNER_TEMP/jam-graal-ci/graalvm" >> $env:GITHUB_ENV
          Remove-Item "$env:RUNNER_TEMP/jam-graal-download/jam-graal-ci.tar.gz"
      - name: Select dependency directory
        run: '"JAM_CI_TOOLS=$env:RUNNER_TEMP/jam-vm-toolchain" >> $env:GITHUB_ENV'
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jam-vm-toolchain
          key: windows-2022-x86_64-graal-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
          restore-keys: |
            windows-2022-x86_64-hotspot-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
            windows-2022-x86_64-native-${{ hashFiles('vm/tools/ci/setup_windows.ps1') }}
      - name: Install runtime check dependencies
        timeout-minutes: 10
        run: ./tools/ci/setup_windows.ps1 graal
      - name: Run compiled heap and weak-pointer regressions
        if: matrix.suite == 'GraalVM runtime'
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/check_graal.py --java-home "$env:JAM_CI_JAVA_HOME" `
            --unsupported-libgraal "$env:JAM_STOCK_GRAAL_HOME/bin"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_package.py --java-home "$env:JAM_CI_JAVA_HOME"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and run Jam native executables
        if: matrix.suite == 'SubstrateVM'
        run: |
          . "$env:JAM_CI_TOOLS/env.ps1"
          python tools/check_substrate.py --java-home "$env:JAM_CI_JAVA_HOME"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
